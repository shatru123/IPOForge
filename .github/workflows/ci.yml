name: IPOForge CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Build & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore IPOForge.slnx

      - name: Build Solution
        run: dotnet build IPOForge.slnx --no-restore --configuration Release

      - name: Run Unit & Integration Tests
        run: dotnet test IPOForge.slnx --no-build --configuration Release --verbosity normal

  frontend-build:
    name: Frontend Lint & Vite Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ipo-forge-web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/ipo-forge-web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend SPA
        run: npm run build
